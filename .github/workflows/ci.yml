name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for app
        run: |
          echo "Containers and port mapping:"
          docker compose ps -a
          docker port poll-frontend 2>/dev/null || true
          echo "Waiting for app on http://127.0.0.1:3001 ..."
          sleep 5
          for i in $(seq 1 60); do
            if curl -4 -sf --connect-timeout 5 http://127.0.0.1:3001/ > /dev/null 2>&1; then
              echo "App is up after ${i} attempts"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "App did not respond in time. Container logs:"
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          sleep 2

      - name: Validate API
        run: |
          curl -4 -sf http://127.0.0.1:3001/api/health | grep -q '"status":"ok"' || (echo "Health check failed" && exit 1)
          ID=$(curl -4 -sf -X POST http://127.0.0.1:3001/api/polls -H "Content-Type: application/json" -d '{"question":"Test?","options":["A","B"]}' | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
          test -n "$ID" || (echo "Create poll failed" && exit 1)
          curl -4 -sf "http://127.0.0.1:3001/api/polls/$ID/results" | grep -q "Test?" || (echo "Get results failed" && exit 1)
          echo "Validation passed"

      - name: Stop services
        if: always()
        run: docker compose down
