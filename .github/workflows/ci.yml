name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for app
        run: |
          echo "Waiting for app on http://localhost:3000 ..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "App is up after ${i} attempts"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "App did not respond in time. Container logs:"
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          sleep 2

      - name: Validate API
        run: |
          curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"' || (echo "Health check failed" && exit 1)
          # Create poll
          ID=$(curl -sf -X POST http://localhost:3000/api/polls -H "Content-Type: application/json" -d '{"question":"Test?","options":["A","B"]}' | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
          test -n "$ID" || (echo "Create poll failed" && exit 1)
          # Get results
          curl -sf "http://localhost:3000/api/polls/$ID/results" | grep -q "Test?" || (echo "Get results failed" && exit 1)
          echo "Validation passed"

      - name: Stop services
        if: always()
        run: docker compose down
