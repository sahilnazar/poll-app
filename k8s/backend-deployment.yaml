apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll-backend
  labels:
    app: poll-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poll-backend
  template:
    metadata:
      labels:
        app: poll-backend
    spec:
      containers:
        - name: backend
          image: poll-app-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: poll-backend
spec:
  selector:
    app: poll-backend
  ports:
    - port: 4000
      targetPort: 4000
